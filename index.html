<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goser</title>
    
    <!-- Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">
    <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>

    <style>
        /* Font: Product Sans */
        @font-face {
            font-family: 'Product Sans';
            src: url('https://fontawesomee.github.io/fontachsin/Product Sans Regular.ttf') format('truetype');
            font-weight: normal;
        }
        @font-face {
            font-family: 'Product Sans';
            src: url('https://fontawesomee.github.io/fontachsin/Product Sans Bold.ttf') format('truetype');
            font-weight: bold;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Product Sans', sans-serif;
        }

        body {
            background-color: #fcfcfc;
            color: #333;
            overflow-x: hidden;
        }

        /* Top Header Green Bar */
        .top-bar {
            background-color: #20AFA7;
            height: 140px;
            width: 100%;
            position: absolute;
            top: 0;
            z-index: 1;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        /* Search Bar */
        .search-container {
            position: relative;
            z-index: 10;
            padding: 15px 20px;
            margin-top: 5px;
        }

        .search-box {
            background: white;
            display: flex;
            align-items: center;
            padding: 12px 18px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .search-box i {
            color: #20AFA7;
            font-size: 20px;
            margin-right: 12px;
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        /* Banner Slider */
        .banner-wrap {
            position: relative;
            z-index: 5;
            margin: 10px 0;
        }

        .owl-carousel .item img {
            width: 90%;
            margin: 0 auto;
            height: 180px;
            border-radius: 20px;
            object-fit: cover;
            display: block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Goser Wallet */
        .goser-wallet {
            background: white;
            width: 90%;
            margin: 15px auto;
            border-radius: 20px;
            display: flex;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            position: relative;
            z-index: 10;
            border: 1px solid #eee;
        }

        .wallet-info {
            width: 50%;
            border-right: 1px solid #f0f0f0;
            padding-left: 10px;
        }

        .wallet-info .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .wallet-info .balance {
            font-size: 18px;
            font-weight: bold;
            color: #20AFA7;
            margin-top: 2px;
        }

        .wallet-btns {
            width: 50%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .btn-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #444;
        }

        .btn-item i {
            background: #E6F7F6;
            color: #20AFA7;
            padding: 8px;
            border-radius: 10px;
            font-size: 20px;
            margin-bottom: 5px;
        }

        /* Grid Services */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px;
            background: white;
        }

        .service-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .icon-square {
            width: 55px;
            height: 55px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            transition: 0.2s;
        }

        .icon-square:active { transform: scale(0.9); }

        .service-item span {
            font-size: 12px;
            font-weight: bold;
            color: #555;
        }

        /* Service Colors */
        .bg-ride { background: #E6F7F6; }
        .bg-car  { background: #FEECEB; }
        .bg-food { background: #EBF5FF; }
        .bg-send { background: #FFF4EB; }
        .bg-mart { background: #F3EFFF; }
        .bg-box  { background: #EFFFFA; }
        .bg-more { background: #F5F5F5; }

        .service-item img { width: 32px; height: 32px; }

        /* News Section */
        .news-section {
            padding: 20px;
        }

        .news-section h3 {
            font-size: 16px;
            margin-bottom: 15px;
        }

        .news-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
        }

        .news-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .news-content {
            padding: 15px;
        }

        .news-content p {
            font-size: 13px;
            line-height: 1.5;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="top-bar"></div>

    <!-- Search Section -->
    <div class="search-container">
        <div class="search-box">
            <i class='bx bx-search'></i>
            <input type="text" placeholder="Mau kemana hari ini?">
        </div>
    </div>

    <!-- Banner Slider -->
    <div class="banner-wrap">
        <div class="owl-carousel owl-theme">
            <div class="item"><img src="https://via.placeholder.com/600x300/20AFA7/FFFFFF?text=Goser" alt="Banner 1"></div>
            <div class="item"><img src="https://via.placeholder.com/600x300/20AFA7/FFFFFF?text=Layanan+Cepat+&+Aman" alt="Banner 2"></div>
        </div>
    </div>

    <!-- Goser Wallet -->
    <div class="goser-wallet">
        <div class="wallet-info">
            <div class="label">Saldo GoserPay</div>
            <div class="balance">Rp 0</div>
        </div>
        <div class="wallet-btns">
            <div class="btn-item">
                <i class='bx bx-plus-circle'></i>
                <span>Isi Saldo</span>
            </div>
            <div class="btn-item">
                <i class='bx bx-paper-plane'></i>
                <span>Bayar</span>
            </div>
        </div>
    </div>

    <!-- Services Grid -->
    <div class="services-grid">
        <div class="service-item">
            <div class="icon-square bg-ride"><img src="https://img.icons8.com/color/96/motorcycle.png" alt="Ride"></div>
            <span>GoRide</span>
        </div>
        <div class="service-item">
            <div class="icon-square bg-car"><img src="https://img.icons8.com/color/96/car.png" alt="Car"></div>
            <span>GoCar</span>
        </div>
        <div class="service-item">
            <div class="icon-square bg-food"><img src="https://img.icons8.com/color/96/hamburger.png" alt="Food"></div>
            <span>GoFood</span>
        </div>
        <div class="service-item">
            <div class="icon-square bg-send"><img src="https://img.icons8.com/color/96/box.png" alt="Send"></div>
            <span>GoSend</span>
        </div>
        <div class="service-item">
            <div class="icon-square bg-mart"><img src="https://img.icons8.com/color/96/shopping-basket.png" alt="Mart"></div>
            <span>GoMart</span>
        </div>
        <div class="service-item">
            <div class="icon-square bg-box"><img src="https://img.icons8.com/color/96/truck.png" alt="Box"></div>
            <span>GoBox</span>
        </div>
        <div class="service-item">
            <div class="icon-square bg-ride"><img src="https://img.icons8.com/color/96/moped.png" alt="Kurir"></div>
            <span>Kurir</span>
        </div>
        <div class="service-item">
            <div class="icon-square bg-more"><i class='bx bx-grid-alt' style="font-size: 30px; color: #999;"></i></div>
            <span>Lainnya</span>
        </div>
    </div>

    <!-- News/Info Section -->
    <div class="news-section">
        <h3>Info Goser</h3>
        <div class="news-card">
            <img src="https://via.placeholder.com/600x300/f0f0f0/999999?text=Berita+Goser" alt="News">
            <div class="news-content">
                <p>Nikmati kemudahan transportasi dan pesan antar makanan dengan harga terjangkau melalui layanan kami.</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script>
        $(document).ready(function(){
            $(".owl-carousel").owlCarousel({
                items: 1,
                loop: true,
                autoplay: true,
                margin: 10,
                autoplayTimeout: 4000,
                nav: false,
                dots: true
            });
        });
    </script>
</body>
</html>
