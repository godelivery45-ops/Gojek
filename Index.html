
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AchsinDesign</title>
    <!-- Owl Carousel CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">
    <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>

    <style>
        @font-face {
            font-family: 'Product Sans';
            src: url('https://fontawesomee.github.io/fontachsin/Product Sans Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Product Sans';
            src: url('https://fontawesomee.github.io/fontachsin/Product Sans Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        @font-face {
            font-family: 'Product Sans';
            src: url('https://fontawesomee.github.io/fontachsin/Product Sans Italic.ttf') format('truetype');
            font-weight: normal;
            font-style: italic;
        }

        @font-face {
            font-family: 'Product Sans';
            src: url('https://fontawesomee.github.io/fontachsin/Product Sans Bold Italic.ttf') format('truetype');
            font-weight: bold;
            font-style: italic;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        body {
            background: white;
            height: 100vh;
            width: 100%;
        }

        a {
            text-decoration: none;
            color: black;
        }

        /* Container untuk animasi love */
        .love-container {
            position: absolute;
            width: 100%;
            height: 100%;
            bottom: 40px;
            z-index: 101;
            overflow: hidden;
            pointer-events: none;
        }

        /* Animasi Love */
        .love {
            position: absolute;
            color: red;
            font-size: 30px;
            opacity: 0.1;
            animation: floatUp 5s infinite ease-in-out, shake 1s infinite alternate ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 0.1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
            100% { transform: translateX(3px); }
        }

        #kotak-header {
            width: 100%;
            height: 65px;
            background-color: #20AFA7;
            color: #fff;
            font-family: Arial;
            font-size: 15px;
            font-weight: 700;
            position: fixed;
            top: 0;
            left: 0;
            padding: 10px 15px;
            z-index: 99;
        }

        .search_wrap {
            width: 100%;
            margin: 60px auto;
        }

        .search_wrap .search_box {
            position: fixed;
            width: 100%;
            height: 0;
            z-index: 100;
        }

        .search_wrap .search_box .input-container {
            position: fixed;
            top: 5px;
            left: 15px;
            width: 77%;
            display: flex;
            align-items: center;
            background: #fff;
            padding: 12px;
            border-radius: 20px;
        }

        .search_wrap .search_box .input-container i {
            font-size: 18px;
            color: gray;
            margin-right: 8px;
            font-family: 'Product Sans';
        }

        .search_wrap .search_box .input-container input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            color: black;
            font-weight: 500;
            background: transparent;
            font-family: 'Product Sans';
        }

        .owl-carousel .item img {
            width: 100%;
            height: auto;
            border-radius: 0px;
            background: #20AFA7;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        /* Wallet Container */
        .wallet-container {
            position: relative;
            width: 91.5%;
            margin: 0 auto;
            max-width: 100%;
            background-color: #20AFA7;
            border-radius: 20px;
            padding: 8px;
            color: white;
            display: flex;
            align-items: center;
            z-index: 5;
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            margin-top: -35px;
            font-family: 'Product Sans';
        }

        .wallet-slider {
            width: 45%;
            height: 79px;
            position: relative;
            overflow: hidden;
        }

        .wallet-actions {
            width: 55%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .wallet-actions div {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .wallet-actions div img {
            width: 30px;
            height: 30px;
            padding: 3px;
        }

        .wallet-actions div span {
            margin-top: 5px;
            font-size: 12px;
            font-family: 'Product Sans';
        }

        /* Menu Container */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 19px;
            justify-content: center;
            max-width: 1700px;
            margin-top: -20px;
            z-index: 4;
            padding: 35px;
        }

        .menu-item {
            position: relative;
            text-align: center;
            cursor: pointer;
            width: 60px;
            height: 60px;
            margin-top: 15px;
        }

        .menu-item::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 85%;
            height: 85%;
            border-radius: 15px;
            background: linear-gradient(135deg, #CCF8F5, #F6FFF7);
            z-index: 2;
        }

        .menu-hijau::before { background: linear-gradient(135deg, #C3FEC9, #F6FFF7); }
        .menu-merah::before { background: linear-gradient(135deg, #FEB7BC, #FFF9FA); }
        .menu-biru::before { background: linear-gradient(135deg, #9AECFF, #F5FDFF); }
        .menu-orange::before { background: linear-gradient(135deg, #FCC7AD, #FFF9F6); }

        .menu-item img {
            position: relative;
            width: 60%;
            height: 60%;
            z-index: 1;
            display: block;
            margin: 15% auto;
        }

        .menu-item span {
            display: block;
            margin-top: 17px;
            font-size: 14px;
            color: #333;
            font-family: 'Product Sans';
        }

        .balance-card {
            width: 92%;
            height: 116px;
            margin-top: 6px;
            background: white;
            border-radius: 16px;
            padding: 0px 10px 0px 20px;
            text-align: left;
            box-shadow: 1px 1px 8px 1px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .balance-card .amount {
            font-size: 18px;
            font-family: 'Product Sans';
            font-weight: bold;
            margin-top: 5px
        }

        .balance-card .sub-text {
            font-size: 14px;
            color: orange;
            margin-top: 10px;
            font-family: 'Product Sans';
        }

        .balance-card .underline {
            width: 75%;
            height: 4px;
            background-color: #20AFA7;
            border-radius: 5px;
            position: absolute;
            bottom: 10px;
            left: 20px;
        }

        .point-containerpr {
            width: 100%;
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div id="kotak-header"></div>
    <div class="search_wrap">
        <div class="search_box">
            <div class="input-container">
                <i class='bx bx-search'></i>
                <input type="text" placeholder="Cari di Gosergai...">
            </div>
        </div>
    </div>

    <!-- Owl Carousel Banner Placeholder -->
    <div class="owl-carousel owl-theme">
        <div class="item"><img src="https://via.placeholder.com/500x200/20AFA7/FFFFFF?text=Banner+Goser" alt="Banner"></div>
    </div>

    <div class="wallet-container">
        <div class="wallet-slider">
            <div class="balance-card">
                <div class="amount">Rp 0</div>
                <div class="sub-text">Saldo Goser</div>
                <div class="underline"></div>
            </div>
        </div>
        <div class="wallet-actions">
            <div>
                <img src="https://img.icons8.com/color/48/000000/wallet.png" alt="Topup">
                <span>Top Up</span>
            </div>
            <div>
                <img src="https://img.icons8.com/color/48/000000/data-transfer.png" alt="Transfer">
                <span>Transfer</span>
            </div>
        </div>
    </div>

    <div class="menu-container">
        <div class="menu-item menu-hijau">
            <img src="https://img.icons8.com/color/48/000000/motorcycle.png" alt="Ride">
            <span>Ride</span>
        </div>
        <div class="menu-item menu-merah">
            <img src="https://img.icons8.com/color/48/000000/car.png" alt="Car">
            <span>Car</span>
        </div>
        <div class="menu-item menu-biru">
            <img src="https://img.icons8.com/color/48/000000/hamburger.png" alt="Food">
            <span>Food</span>
        </div>
        <div class="menu-item menu-orange">
            <img src="https://img.icons8.com/color/48/000000/box.png" alt="Send">
            <span>Send</span>
        </div>
    </div>

    <div class="point-containerpr">
        <!-- Konten tambahan di sini -->
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script>
        $(document).ready(function () {
            $(".owl-carousel").owlCarousel({
                items: 1,
                loop: true,
                autoplay: true,
                autoplayTimeout: 3000
            });
        });
    </script>
</body>
</html>
